name: 推送测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 发送测试推送
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python3 .github/scripts/push_test.py
